<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link href="shared/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="TemplateData56/style.css" />
    <script src="TemplateData56/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <script>
      window.origBlob = window.Blob;
      window.Blob = function (array, options) {
        if (array[1] instanceof Uint8Array) {
          array[1] = new TextDecoder("utf-8").decode(array[1]).replace(/window\.top\.location\.href|window\.location\.href|document\.referrer|document\.URL/g, '"https://storage.y8.com/"');
        }
        return new window.origBlob(array, options);
      };

      async function startEngine() {
        const dataParts = [
          "Build/WaterParkSlides3Dx2.data.1",
          "Build/WaterParkSlides3Dx2.data.2"
        ];

        try {
          const downloads = [
            ...dataParts.map(url => fetch(url).then(res => {
              if (!res.ok) throw new Error();
              return res.arrayBuffer();
            })),
            fetch("Build/WaterParkSlides3Dx2.json").then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
          ];

          const results = await Promise.all(downloads);
          const buffer1 = results[0];
          const buffer2 = results[1];
          const config = results[2];

          const combinedBlob = new window.origBlob([buffer1, buffer2], { type: "application/octet-stream" });
          const blobUrl = URL.createObjectURL(combinedBlob);

          config.dataUrl = blobUrl;

          window.gameInstance = UnityLoader.instantiate("gameContainer", config, {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function () {
                UnityProgress(window.gameInstance, "complete");
                setTimeout(() => {
                  URL.revokeObjectURL(blobUrl);
                }, 5000);
              },
            },
          });

        } catch (error) {
          console.error(error);
        }
      }

      startEngine();
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100vw; height: 100vh;"></div>
    </div>
  </body>
</html>
