<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link href="shared/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="TemplateData56/style.css" />
    <script src="TemplateData56/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <script>
      window.origBlob = window.Blob;
      window.Blob = function (array, options) {
        if (array[1] instanceof Uint8Array) {
          array[1] = new TextDecoder("utf-8").decode(array[1]).replace(/window\.top\.location\.href|window\.location\.href|document\.referrer|document\.URL/g, '"https://storage.y8.com/"');
        }
        return new window.origBlob(array, options);
      };

      let combinedBlobUrl = null;

      async function prepareData() {
        const dataParts = [
          "Build/WaterParkSlides3Dx2.data.1",
          "Build/WaterParkSlides3Dx2.data.2"
        ];

        try {
          const downloads = dataParts.map(url => fetch(url).then(res => {
            if (!res.ok) throw new Error();
            return res.arrayBuffer();
          }));

          const buffers = await Promise.all(downloads);
          const combinedBlob = new window.origBlob(buffers, { type: "application/octet-stream" });
          combinedBlobUrl = URL.createObjectURL(combinedBlob);

          const originalFetch = window.fetch;
          window.fetch = function (input, init) {
            if (typeof input === "string" && input.includes("WaterParkSlides3Dx2.data.unityweb")) {
              return originalFetch(combinedBlobUrl, init);
            }
            return originalFetch(input, init);
          };

          const originalXHR = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function (method, url, ...args) {
            if (typeof url === "string" && url.includes("WaterParkSlides3Dx2.data.unityweb")) {
              url = combinedBlobUrl;
            }
            return originalXHR.apply(this, [method, url, ...args]);
          };

          window.gameInstance = UnityLoader.instantiate("gameContainer", "Build/WaterParkSlides3Dx2.json", {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function () {
                UnityProgress(window.gameInstance, "complete");
                setTimeout(() => {
                  if (combinedBlobUrl) {
                    URL.revokeObjectURL(combinedBlobUrl);
                  }
                }, 5000);
              },
            },
          });

        } catch (error) {
          console.error(error);
        }
      }

      prepareData();
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100vw; height: 100vh;"></div>
    </div>
  </body>
</html>
